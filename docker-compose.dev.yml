services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: petclinic-react-backend:dev
    ports:
      - "9966:9966"
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
    volumes:
      # Whole repository, so an IDE attached to this container edits the real files.
      - .:/workspace
      # Keep Maven output inside the container, not in the host folder.
      - backend-target:/workspace/target
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    image: petclinic-react-frontend:dev
    ports:
      - "4444:4444"
    environment:
      API_SERVER_URL: http://localhost:9966/petclinic
    volumes:
      - ./client/src:/workspace/src
      - ./client/public:/workspace/public
      - ./client/webpack.config.dev.js:/workspace/webpack.config.dev.js
      - ./client/webpack.config.docker.js:/workspace/webpack.config.docker.js
    depends_on:
      - backend
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile.dev
    image: petclinic-mcp-server:dev
    ports:
      # 0.0.0.0 に公開する（backend/frontend と同様）。127.0.0.1 のみだと
      # Docker Desktop + WSL2 上で Windows 側 Cursor が ECONNREFUSED になることがある。
      - "8090:8090"
    environment:
      PETCLINIC_API_BASE_URL: http://backend:9966/petclinic/api
    volumes:
      - ./mcp-server/src:/workspace/src
      - ./mcp-server/pom.xml:/workspace/pom.xml
      - mcp-server-target:/workspace/target
    depends_on:
      - backend

volumes:
  backend-target:
  mcp-server-target:
