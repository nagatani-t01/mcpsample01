server:
  port: ${MCP_SERVER_PORT:8090}

spring:
  application:
    name: petclinic-mcp-server
  ai:
    mcp:
      server:
        name: petclinic-mcp-server
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: true

petclinic:
  api:
    base-url: ${PETCLINIC_API_BASE_URL:http://localhost:9966/petclinic/api}
    timeout: ${PETCLINIC_API_TIMEOUT:10s}
    username: ${PETCLINIC_API_USERNAME:}
    password: ${PETCLINIC_API_PASSWORD:}
  mcp:
    trace-enabled: ${MCP_TRACE_ENABLED:true}
    privacy:
      # 個人情報保護を有効にする（同意前は仮名化、同意後は実名）
      consent-required: ${MCP_PERSONAL_DATA_CONSENT_REQUIRED:true}
      # true: 同意なしでも仮名化して返す / false: 同意なしは遮断（例外）
      masking-enabled: ${MCP_PERSONAL_DATA_MASKING_ENABLED:true}

mcp:
  allowed-origins: ${MCP_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}

logging:
  level:
    org.springframework.samples.petclinic.mcp.client: DEBUG
    org.springframework.samples.petclinic.mcp.config.McpHttpTraceFilter: INFO
    org.springframework.samples.petclinic.mcp.config.McpToolTraceAspect: INFO
    org.springframework.samples.petclinic.mcp.config.PetclinicApiTraceInterceptor: INFO